<div class="page-wrapper" [ngClass]="{ toggled: activeSidebar }">
  <!-- sidebar-wrapper -->
  <app-dark-sidebar />
  <!-- sidebar-wrapper  -->

  <!-- Start Page Content -->
  <main class="page-content bg-gray-50 dark:bg-slate-800">
    <!-- Top Header -->
    <app-top-header (toggleClass)="toggleClass()" />
    <!-- Top Header -->

    <div class="container-fluid relative px-3">
      <div class="layout-specing">
        <h1 style="font-weight: bold; margin-bottom: 24px">
          Proveedores disponibles
        </h1>
        <hr />
        <div class="card rounded-md shadow border-0 mt-4">
          <div class="card-body p-0">
            <div
              class="table-responsive rounded-md"
              [ngClass]="{
                'bg-white': !isDarkMode,
                'bg-slate-900': isDarkMode
              }"
              style="width: 100%"
            >
              <table class="table mb-0 table-hover" style="width: 100%">
                <thead
                  [ngClass]="{
                    'bg-gray-100': !isDarkMode,
                    'bg-slate-800 text-white': isDarkMode
                  }"
                >
                  <tr>
                    <th class="text-start py-3 px-4" style="width: 200px">
                      Nombre
                    </th>
                    <th class="text-start py-3 px-4" style="width: 200px">
                      Servicio
                    </th>
                    <th class="text-start py-3 px-4" style="width: 150px">
                      Calificación
                    </th>
                    <th class="text-center py-3 px-4" style="width: 150px">
                      Acciones
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="let provider of providers; let i = index"
                    [ngClass]="{
                      'bg-gray-200': !isDarkMode && i % 2 === 0,
                      'bg-blue-100': !isDarkMode && i % 2 !== 0,
                      'bg-gray-800 text-white': isDarkMode && i % 2 === 0,
                      'bg-blue-900 text-white': isDarkMode && i % 2 !== 0
                    }"
                    style="border-bottom: 1px solid #222"
                  >
                    <td class="py-3 px-4">{{ provider.name }}</td>
                    <td class="py-3 px-4">{{ provider.service }}</td>
                    <td class="py-3 px-4">
                      <span class="badge bg-success">{{
                        provider.rating
                      }}</span>
                    </td>
                    <td class="py-3 px-4 text-center">
                      <button 
                        (click)="editProvider(provider)"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm transition-colors"
                        title="Editar proveedor">
                        <i class="fas fa-edit"></i> Editar
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="pagination mt-3">
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="prevPage()"
            [disabled]="page === 1"
          >
            Anterior
          </button>
          <span class="mx-2">Página {{ page }} de {{ totalPages }}</span>
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="nextPage()"
            [disabled]="page === totalPages"
          >
            Siguiente
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Start -->
    <app-footer />
    <!-- End -->
  </main>
  <!--End page-content" -->
</div>

<!-- Edit Provider Modal -->
<div *ngIf="showEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" (click)="closeEditModal()">
  <div class="bg-white dark:bg-slate-800 rounded-lg p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold dark:text-white">Editar Proveedor</h2>
      <button (click)="closeEditModal()" class="text-gray-500 hover:text-gray-700">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Success/Error Messages -->
    <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="saveProvider()" #editForm="ngForm">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Nombre</label>
        <input 
          type="text" 
          [(ngModel)]="editingProvider.name" 
          name="name"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Descripción</label>
        <textarea 
          [(ngModel)]="editingProvider.description" 
          name="description"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Servicio *</label>
        <select 
          [(ngModel)]="editingProvider.service_id" 
          name="service_id"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
          <option value="">-- Selecciona un servicio --</option>
          <option *ngFor="let service of services" [value]="service.id">
            {{ service.name }}
          </option>
        </select>
        <p *ngIf="loadingServices" class="text-sm text-gray-500 mt-1">Cargando servicios...</p>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Email</label>
        <input 
          type="email" 
          [(ngModel)]="editingProvider.email" 
          name="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Teléfono</label>
        <input 
          type="text" 
          [(ngModel)]="editingProvider.phone" 
          name="phone"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-2 dark:text-gray-300">Calificación</label>
        <input 
          type="number" 
          [(ngModel)]="editingProvider.rating" 
          name="rating"
          min="0"
          max="5"
          step="0.1"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-700 dark:border-slate-600 dark:text-white">
      </div>

      <div class="flex justify-end space-x-3">
        <button 
          type="button" 
          (click)="closeEditModal()"
          class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-md transition-colors">
          Cancelar
        </button>
        <button 
          type="submit"
          [disabled]="!editForm.valid || saving"
          class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md transition-colors disabled:opacity-50">
          {{ saving ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
