<div class="page-wrapper" [ngClass]="{ toggled: activeSidebar }">
  <!-- sidebar-wrapper -->
  <app-dark-sidebar />
  <!-- sidebar-wrapper  -->

  <!-- Start Page Content -->
  <main class="page-content bg-gray-50 dark:bg-slate-800">
    <!-- Top Header -->
    <app-top-header (toggleClass)="toggleClass()" />
    <!-- Top Header -->

    <div class="container-fluid relative px-3">
      <div class="layout-specing">
        <h1 style="font-weight: bold; margin-bottom: 24px">
          Proveedores disponibles
        </h1>
        <hr />
        <div class="card rounded-md shadow border-0 mt-4">
          <div class="card-body p-0">
            <div
              class="table-responsive rounded-md"
              [ngClass]="{
                'bg-white': !isDarkMode,
                'bg-slate-900': isDarkMode
              }"
              style="width: 100%"
            >
              <table class="table mb-0 table-hover" style="width: 100%">
                <thead
                  [ngClass]="{
                    'bg-gray-100': !isDarkMode,
                    'bg-slate-800 text-white': isDarkMode
                  }"
                >
                  <tr>
                    <th class="text-start py-3 px-4" style="width: 60px">ID</th>
                    <th class="text-start py-3 px-4" style="width: 200px">
                      Nombre
                    </th>
                    <th class="text-start py-3 px-4" style="width: 200px">
                      Servicio
                    </th>
                    <th class="text-start py-3 px-4" style="width: 150px">
                      Calificación
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    *ngFor="let provider of providers; let i = index"
                    [ngClass]="{
                      'bg-gray-200': !isDarkMode && i % 2 === 0,
                      'bg-blue-100': !isDarkMode && i % 2 !== 0,
                      'bg-gray-800 text-white': isDarkMode && i % 2 === 0,
                      'bg-blue-900 text-white': isDarkMode && i % 2 !== 0
                    }"
                    style="border-bottom: 1px solid #222"
                  >
                    <td class="py-3 px-4">{{ provider.id }}</td>
                    <td class="py-3 px-4">{{ provider.name }}</td>
                    <td class="py-3 px-4">{{ provider.service }}</td>
                    <td class="py-3 px-4">
                      <span class="badge bg-success">{{
                        provider.rating
                      }}</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="pagination mt-3">
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="prevPage()"
            [disabled]="page === 1"
          >
            Anterior
          </button>
          <span class="mx-2">Página {{ page }} de {{ totalPages }}</span>
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="nextPage()"
            [disabled]="page === totalPages"
          >
            Siguiente
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Start -->
    <app-footer />
    <!-- End -->
  </main>
  <!--End page-content" -->
</div>
