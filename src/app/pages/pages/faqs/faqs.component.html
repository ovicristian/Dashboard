<div class="page-wrapper" [ngClass]="{ 'toggled': activeSidebar }">
    <!-- sidebar-wrapper -->
    <app-dark-sidebar/>
    <!-- sidebar-wrapper  -->

    <!-- Start Page Content -->
    <main class="page-content bg-gray-50 dark:bg-slate-800">
        <!-- Top Header -->
        <app-top-header (toggleClass)="toggleClass()"/>
        <!-- Top Header -->
       
        <div class="container-fluid relative px-3">
            <div class="layout-specing">
                <!-- Start Content -->
                <div class="md:flex justify-between items-center">
                    <div>
                        <h5 class="text-lg font-semibold">Frequently Asked Questions</h5>

                        <ul class="tracking-[0.5px] inline-block mt-2">
                            <li class="inline-block capitalize text-[14px] font-bold duration-500 dark:text-white/70 hover:text-indigo-600 dark:hover:text-white"><a routerLink="/">Techwind</a></li>
                            <li class="inline-block text-base text-slate-950 dark:text-white/70 mx-0.5 ltr:rotate-0 rtl:rotate-180"><i class="uil uil-angle-right-b"></i></li>
                            <li class="inline-block capitalize text-[14px] font-bold text-indigo-600 dark:text-white" aria-current="page">FAQs</li>
                        </ul>
                    </div>

                    <div>
                        <a routerLink="#" class="h-8 w-8 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-[20px] text-center bg-gray-800/5 hover:bg-gray-800/10 dark:bg-gray-800 border border-gray-800/5 dark:border-gray-800 text-slate-900 dark:text-white rounded-full" (click)="onModalClick()" title="Add New"><i data-feather="plus" class="h-4 w-4"></i></a>
                    </div>
                </div>

                <div class="grid lg:grid-cols-2 grid-cols-1 mt-6 gap-6">
                    <div class="rounded-md shadow dark:shadow-gray-700 p-6 bg-white dark:bg-slate-900">
                        <h5 class="font-semibold">Buying Product</h5>

                        <div class="mt-6">
                            <div *ngFor="let item of faqData" class="relative shadow dark:shadow-gray-700 rounded-md overflow-hidden mt-4">
                                <h2 class="text-base font-semibold" id="accordion-collapse-heading-1">
                                    <button type="button" class="flex justify-between items-center p-5 w-full font-medium text-start" [ngClass]="activeIndex === item.id ? 'bg-gray-50 dark:bg-slate-800 text-indigo-600' : '' " (click)="openAccordion(item.id)">
                                        <span>{{item.title}}</span>
                                        <svg data-accordion-icon class="size-4  shrink-0" [ngClass]="activeIndex === item.id ? 'rotate-180' : '' " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                        </svg>
                                    </button>
                                </h2>
                                <div [ngClass]="activeIndex === item.id ? '' : 'hidden' ">
                                    <div class="p-5">
                                        <p class="text-slate-400 dark:text-gray-400">{{item.desc}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rounded-md shadow dark:shadow-gray-700 p-6 bg-white dark:bg-slate-900">
                        <h5 class="font-semibold">General Questions</h5>

                        <div class="mt-6">
                            <div *ngFor="let item of faqData" class="relative shadow dark:shadow-gray-700 rounded-md overflow-hidden mt-4">
                                <h2 class="text-base font-semibold" id="accordion-collapse-heading-1">
                                    <button type="button" class="flex justify-between items-center p-5 w-full font-medium text-start" [ngClass]="activeIndex2 === item.id ? 'bg-gray-50 dark:bg-slate-800 text-indigo-600' : '' " (click)="openAccordion2(item.id)">
                                        <span>{{item.title}}</span>
                                        <svg data-accordion-icon class="size-4  shrink-0" [ngClass]="activeIndex2 === item.id ? 'rotate-180' : '' " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                        </svg>
                                    </button>
                                </h2>
                                <div [ngClass]="activeIndex2 === item.id ? '' : 'hidden' ">
                                    <div class="p-5">
                                        <p class="text-slate-400 dark:text-gray-400">{{item.desc}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rounded-md shadow dark:shadow-gray-700 p-6 bg-white dark:bg-slate-900">
                        <h5 class="font-semibold">Payments Questions</h5>

                        <div class="mt-6">
                            <div *ngFor="let item of faqData" class="relative shadow dark:shadow-gray-700 rounded-md overflow-hidden mt-4">
                                <h2 class="text-base font-semibold" id="accordion-collapse-heading-1">
                                    <button type="button" class="flex justify-between items-center p-5 w-full font-medium text-start" [ngClass]="activeIndex3 === item.id ? 'bg-gray-50 dark:bg-slate-800 text-indigo-600' : '' " (click)="openAccordion3(item.id)">
                                        <span>{{item.title}}</span>
                                        <svg data-accordion-icon class="size-4  shrink-0" [ngClass]="activeIndex3 === item.id ? 'rotate-180' : '' " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                        </svg>
                                    </button>
                                </h2>
                                <div [ngClass]="activeIndex3 === item.id ? '' : 'hidden' ">
                                    <div class="p-5">
                                        <p class="text-slate-400 dark:text-gray-400">{{item.desc}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rounded-md shadow dark:shadow-gray-700 p-6 bg-white dark:bg-slate-900">
                        <h5 class="font-semibold">Support Questions</h5>

                        <div class="mt-6">
                            <div *ngFor="let item of faqData" class="relative shadow dark:shadow-gray-700 rounded-md overflow-hidden mt-4">
                                <h2 class="text-base font-semibold" id="accordion-collapse-heading-1">
                                    <button type="button" class="flex justify-between items-center p-5 w-full font-medium text-start" [ngClass]="activeIndex4 === item.id ? 'bg-gray-50 dark:bg-slate-800 text-indigo-600' : '' " (click)="openAccordion4(item.id)">
                                        <span>{{item.title}}</span>
                                        <svg data-accordion-icon class="size-4  shrink-0" [ngClass]="activeIndex4 === item.id ? 'rotate-180' : '' " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                        </svg>
                                    </button>
                                </h2>
                                <div [ngClass]="activeIndex4 === item.id ? '' : 'hidden' ">
                                    <div class="p-5">
                                        <p class="text-slate-400 dark:text-gray-400">{{item.desc}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End Content -->
            </div>
        </div>

        <!-- Footer Start -->
       <app-footer/>
        <!-- End -->
    </main>
    <!--End page-content" -->
</div>

<div class="fixed top-0 left-0 bottom-0 right-0 w-full h-screen bg-slate-900/50 flex items-center justify-center z-999" [ngClass]="isModal === false ? 'hidden' : '' ">
    <div class="rounded-md shadow dark:shadow-gray-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-white inline-block">
        <div class="relative h-auto md:w-[480px] w-300px">
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100 dark:border-gray-700">
                <h3 class="font-bold text-lg">Add new question</h3>
                <form method="dialog">
                    <button class="size-6 flex justify-center items-center shadow dark:shadow-gray-800 rounded-md btn-ghost" (click)="onModalClick()"><i data-feather="x" class="size-4"></i></button>
                </form>
            </div>
            <div class="p-4">                        
                <form>
                    <div class="grid grid-cols-12 gap-3">
                        <div class="col-span-12">
                            <label class="font-semibold">Question <span class="text-red-600">*</span></label>
                            <input name="name" id="name" type="text" class="form-input w-full py-2 px-3 h-10 bg-transparent dark:bg-slate-900 dark:text-slate-200 rounded outline-none border border-gray-200 focus:border-indigo-600 dark:border-gray-800 dark:focus:border-indigo-600 focus:ring-0 mt-2" placeholder="Title :">
                        </div><!--end col-->

                        <div class="col-span-12">
                            <label class="font-semibold"> Answer </label>
                            <textarea name="comments" id="comments" class="form-input w-full py-2 px-3 h-24 bg-transparent dark:bg-slate-900 dark:text-slate-200 rounded outline-none border border-gray-200 focus:border-indigo-600 dark:border-gray-800 dark:focus:border-indigo-600 focus:ring-0 mt-2" placeholder="Description :"></textarea>
                        </div><!--end col-->

                        <div class="col-span-12">
                            <button type="submit" class="py-2 px-5 inline-block font-semibold tracking-wide border align-middle duration-500 text-base text-center bg-indigo-600 hover:bg-indigo-700 border-indigo-600 hover:border-indigo-700 text-white rounded-md">Add Q&A</button>
                        </div><!--end col-->
                    </div>
                </form>
            </div> 
        </div>
    </div>
</div>
