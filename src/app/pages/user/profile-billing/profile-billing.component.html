<div class="page-wrapper" [ngClass]="{ 'toggled': activeSidebar }">
    <!-- sidebar-wrapper -->
    <app-dark-sidebar/>
    <!-- sidebar-wrapper  -->

    <!-- Start Page Content -->
    <main class="page-content bg-gray-50 dark:bg-slate-800">
        <!-- Top Header -->
        <app-top-header (toggleClass)="toggleClass()"/>
        <!-- Top Header -->
       
        <div class="container-fluid relative px-3">
            <div class="layout-specing">
                <div class="grid grid-cols-1">
                    <div class="profile-banner relative text-transparent rounded-md shadow dark:shadow-gray-700 overflow-hidden">
                        <!-- <input id="pro-banner" name="profile-banner" type="file" class="hidden" > -->
                        <div class="relative shrink-0">
                            <img src="assets/images/blog/bg.jpg" class="h-80 w-full object-cover" id="profile-banner" alt="">
                            <div class="absolute inset-0 bg-black/70"></div>
                            <label class="absolute inset-0 cursor-pointer" for="pro-banner"></label>
                        </div>
                    </div>
                </div>

                <div class="grid md:grid-cols-12 grid-cols-1">
                    <div class="xl:col-span-3 lg:col-span-4 md:col-span-4 mx-6">
                       <app-user-tab/>
                    </div>

                    <div class="xl:col-span-9 lg:col-span-8 md:col-span-8 mt-6">
                        <div class="grid grid-cols-1 gap-6">
                            <div class="p-6 relative rounded-md shadow dark:shadow-gray-700 bg-white dark:bg-slate-900">
                                <h6 class="text-slate-400 mb-0">The following addresses will be used on the checkout page by default.</h6>
                                <div class="md:flex mt-6">
                                    <div class="md:w-1/2 md:px-3">
                                        <div class="flex items-center mb-4 justify-between">
                                            <h5 class="text-xl font-semibold">Billing Address:</h5>
                                            <a routerLink="#" class="text-indigo-600 text-lg"><i class="uil uil-edit align-middle"></i></a>
                                        </div>
                                        <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
                                            <p class="text-lg font-semibold mb-2">Cristina Murfy</p>

                                            <ul class="list-none">
                                                <li class="flex ms-0">
                                                    <i class="uil uil-map-marker text-lg me-2"></i>
                                                    <p class="text-slate-400">C/54 Northwest Freeway, Suite 558, <br> Houston, USA 485</p>
                                                </li>

                                                <li class="flex ms-0 mt-1">
                                                    <i class="uil uil-phone text-lg me-2"></i>
                                                    <p class="text-slate-400">+123 897 5468</p>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                    
                                    <div class="md:w-1/2 md:px-3 mt-[30] md:mt-0">
                                        <div class="flex items-center mb-4 justify-between">
                                            <h5 class="text-xl font-semibold">Shipping Address:</h5>
                                            <a routerLink="#" class="text-indigo-600 text-lg"><i class="uil uil-edit align-middle"></i></a>
                                        </div>
                                        <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
                                            <p class="text-lg font-semibold mb-2">Cristina Murfy</p>

                                            <ul class="list-none">
                                                <li class="flex ms-0">
                                                    <i class="uil uil-map-marker text-lg me-2"></i>
                                                    <p class="text-slate-400">C/54 Northwest Freeway, Suite 558, <br> Houston, USA 485</p>
                                                </li>

                                                <li class="flex ms-0 mt-1">
                                                    <i class="uil uil-phone text-lg me-2"></i>
                                                    <p class="text-slate-400">+123 897 5468</p>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End Content -->
            </div>
        </div>

        <!-- Footer Start -->
       <app-footer/>
        <!-- End -->
    </main>
    <!--End page-content" -->
</div>
