<div class="page-wrapper" [ngClass]="{ 'toggled': activeSidebar }">
    <!-- sidebar-wrapper -->
    <app-dark-sidebar/>
    <!-- sidebar-wrapper  -->

    <!-- Start Page Content -->
    <main class="page-content bg-gray-50 dark:bg-slate-800">
        <!-- Top Header -->
        <app-top-header (toggleClass)="toggleClass()"/>
        <!-- Top Header -->
       
        <div class="container-fluid relative px-3">
            <div class="layout-specing">
                <div class="grid grid-cols-1">
                    <div class="profile-banner relative text-transparent rounded-md shadow dark:shadow-gray-700 overflow-hidden">
                        <!-- <input id="pro-banner" name="profile-banner" type="file" class="hidden"> -->
                        <div class="relative shrink-0">
                            <img src="assets/images/blog/bg.jpg" class="h-80 w-full object-cover" id="profile-banner" alt="">
                            <div class="absolute inset-0 bg-black/70"></div>
                            <label class="absolute inset-0 cursor-pointer" for="pro-banner"></label>
                        </div>
                    </div>
                </div>

                <div class="grid md:grid-cols-12 grid-cols-1">
                    <div class="xl:col-span-3 lg:col-span-4 md:col-span-4 mx-6">
                        <app-user-tab/>
                    </div>

                    <div class="xl:col-span-9 lg:col-span-8 md:col-span-8 mt-6">
                        <div class="grid grid-cols-1 gap-6">
                            <div class="relative rounded-md shadow dark:shadow-gray-700 bg-white dark:bg-slate-900">
                                <div class="p-6 border-b border-gray-100 dark:border-gray-700">
                                    <h5 class="text-lg font-semibold">Social Profiles :</h5>
                                </div>
    
                                <div class="p-6 pt-0">
                                    <div *ngFor="let item of socialData" class="md:flex mt-8">
                                        <div class="md:w-1/3">
                                            <span class="font-medium">{{item.name}}</span>
                                        </div>
    
                                        <div class="md:w-2/3 mt-4 md:mt-0">
                                            <form>
                                                <div class="form-icon relative">
                                                    <i [attr.data-feather]="item.icon" class="size-4 absolute top-3 start-4"></i>
                                                    <input type="text" class="form-input ps-12 w-full py-2 px-3 h-10 bg-transparent dark:bg-slate-900 dark:text-slate-200 rounded outline-none border border-gray-200 focus:border-indigo-600 dark:border-gray-800 dark:focus:border-indigo-600 focus:ring-0" [attr.placeholder]="item.title" id="twitter_name" name="name" required="">
                                                </div>
                                            </form>
    
                                            <p class="text-slate-400 mt-1">{{item.desc}}</p>
                                        </div>
                                    </div>
                                    <div class="lg:flex">
                                        <div class="lg:w-1/3">
                                            <button class="py-2 px-5 inline-block font-semibold tracking-wide border align-middle duration-500 text-base text-center bg-indigo-600 hover:bg-indigo-700 border-indigo-600 hover:border-indigo-700 text-white rounded-md mt-5">Save Social Profile</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End Content -->
            </div>
        </div>

        <!-- Footer Start -->
       <app-footer/>
        <!-- End -->
    </main>
    <!--End page-content" -->
</div>
