<div class="page-wrapper" [ngClass]="{ 'toggled': activeSidebar }">
    <!-- sidebar-wrapper -->
    <app-dark-sidebar/>
    <!-- sidebar-wrapper  -->

    <!-- Start Page Content -->
    <main class="page-content bg-gray-50 dark:bg-slate-800">
        <!-- Top Header -->
        <app-top-header (toggleClass)="toggleClass()"/>
        <!-- Top Header -->
       
        <div class="container-fluid relative px-3">
            <div class="layout-specing">
                <div class="grid grid-cols-1">
                    <div class="profile-banner relative text-transparent rounded-md shadow dark:shadow-gray-700 overflow-hidden">
                        <!-- <input id="pro-banner" name="profile-banner" type="file" class="hidden" > -->
                        <div class="relative shrink-0">
                            <img src="assets/images/blog/bg.jpg" class="h-80 w-full object-cover" id="profile-banner" alt="">
                            <div class="absolute inset-0 bg-black/70"></div>
                            <label class="absolute inset-0 cursor-pointer" for="pro-banner"></label>
                        </div>
                    </div>
                </div>

                <div class="grid md:grid-cols-12 grid-cols-1">
                    <div class="xl:col-span-3 lg:col-span-4 md:col-span-4 mx-6">
                        <app-user-tab/>
                    </div>

                    <div class="xl:col-span-9 lg:col-span-8 md:col-span-8 mt-6">
                        <div class="grid grid-cols-1 gap-6">
                            <div class="relative rounded-md shadow dark:shadow-gray-700 bg-white dark:bg-slate-900">
                                <div class="p-6 border-b border-gray-100 dark:border-gray-700">
                                    <h5 class="text-lg font-semibold">Account Notifications :</h5>
                                </div>
    
                                <div class="p-6">
                                    <div class="flex justify-between pb-4">
                                        <h6 class="mb-0 font-medium">When someone mentions me</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" id="noti1">
                                            <label class="form-check-label" for="noti1"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">When someone follows me</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" checked id="noti2">
                                            <label class="form-check-label" for="noti2"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">When shares my activity</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" id="noti3">
                                            <label class="form-check-label" for="noti3"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">When someone messages me</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" id="noti4">
                                            <label class="form-check-label" for="noti4"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
    
                            <div class="relative rounded-md shadow dark:shadow-gray-700 bg-white dark:bg-slate-900">
                                <div class="p-6 border-b border-gray-100 dark:border-gray-700">
                                    <h5 class="text-lg font-semibold">Marketing Notifications :</h5>
                                </div>
    
                                <div class="p-6">
                                    <div class="flex justify-between pb-4">
                                        <h6 class="mb-0 font-medium">There is a sale or promotion</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" id="noti5">
                                            <label class="form-check-label" for="noti5"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">Company news</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" id="noti6">
                                            <label class="form-check-label" for="noti6"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">Weekly jobs</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" checked id="noti7">
                                            <label class="form-check-label" for="noti7"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between py-4 border-t border-gray-100 dark:border-gray-700">
                                        <h6 class="mb-0 font-medium">Unsubscribe News</h6>
                                        <div class="">
                                            <input class="form-checkbox rounded border-gray-200 dark:border-gray-800 text-indigo-600 focus:border-indigo-300 focus:ring focus:ring-offset-0 focus:ring-indigo-200 focus:ring-opacity-50" type="checkbox" value="" checked id="noti8">
                                            <label class="form-check-label" for="noti8"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End Content -->
            </div>
        </div>

        <!-- Footer Start -->
       <app-footer/>
        <!-- End -->
    </main>
    <!--End page-content" -->
</div>
